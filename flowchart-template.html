<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Flowchart Alur Aplikasi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .flowchart {
            width: 100%;
            height: auto;
        }
        
        .shape {
            transition: all 0.3s ease;
        }
        
        .shape:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }
        
        .start-end {
            fill: #4CAF50;
        }
        
        .process {
            fill: #2196F3;
        }
        
        .decision {
            fill: #FF9800;
        }
        
        .input-output {
            fill: #9C27B0;
        }
        
        .text {
            fill: white;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-anchor: middle;
            pointer-events: none;
        }
        
        .arrow {
            stroke: #555;
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrowhead);
        }
        
        .arrow-label {
            fill: #555;
            font-size: 12px;
            font-weight: 500;
        }
        
        .legend {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        
        .legend h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .legend-shape {
            width: 40px;
            height: 30px;
            margin-right: 15px;
            border-radius: 5px;
        }
        
        .legend-text {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Template Flowchart Alur Aplikasi</h1>
        
        <svg class="flowchart" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
            <!-- Define arrow marker -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#555" />
                </marker>
            </defs>
            
            <!-- Start -->
            <ellipse class="shape start-end" cx="400" cy="50" rx="80" ry="40" />
            <text class="text" x="400" y="57">MULAI</text>
            
            <!-- Arrow 1 -->
            <path class="arrow" d="M 400 90 L 400 130" />
            
            <!-- Input User -->
            <path class="shape input-output" d="M 320 130 L 480 130 L 460 180 L 300 180 Z" />
            <text class="text" x="390" y="160">Input Data User</text>
            
            <!-- Arrow 2 -->
            <path class="arrow" d="M 390 180 L 390 220" />
            
            <!-- Process: Validasi -->
            <rect class="shape process" x="310" y="220" width="160" height="60" rx="5" />
            <text class="text" x="390" y="255">Validasi Data</text>
            
            <!-- Arrow 3 -->
            <path class="arrow" d="M 390 280 L 390 320" />
            
            <!-- Decision: Valid? -->
            <path class="shape decision" d="M 390 320 L 490 370 L 390 420 L 290 370 Z" />
            <text class="text" x="390" y="365">Data</text>
            <text class="text" x="390" y="382">Valid?</text>
            
            <!-- Arrow 4: No -->
            <path class="arrow" d="M 290 370 L 200 370 L 200 155 L 300 155" />
            <text class="arrow-label" x="220" y="365">Tidak</text>
            
            <!-- Arrow 5: Yes -->
            <path class="arrow" d="M 390 420 L 390 460" />
            <text class="arrow-label" x="410" y="445">Ya</text>
            
            <!-- Process: Simpan ke Database -->
            <rect class="shape process" x="310" y="460" width="160" height="60" rx="5" />
            <text class="text" x="390" y="485">Simpan ke</text>
            <text class="text" x="390" y="502">Database</text>
            
            <!-- Arrow 6 -->
            <path class="arrow" d="M 390 520 L 390 560" />
            
            <!-- Process: Proses Data -->
            <rect class="shape process" x="310" y="560" width="160" height="60" rx="5" />
            <text class="text" x="390" y="585">Proses Data</text>
            <text class="text" x="390" y="602">Aplikasi</text>
            
            <!-- Arrow 7 -->
            <path class="arrow" d="M 390 620 L 390 660" />
            
            <!-- Decision: Berhasil? -->
            <path class="shape decision" d="M 390 660 L 490 710 L 390 760 L 290 710 Z" />
            <text class="text" x="390" y="705">Proses</text>
            <text class="text" x="390" y="722">Berhasil?</text>
            
            <!-- Arrow 8: No -->
            <path class="arrow" d="M 490 710 L 600 710 L 600 490 L 470 490" />
            <text class="arrow-label" x="520" y="705">Tidak</text>
            
            <!-- Arrow 9: Yes -->
            <path class="arrow" d="M 390 760 L 390 800" />
            <text class="arrow-label" x="410" y="785">Ya</text>
            
            <!-- Output: Tampilkan Hasil -->
            <path class="shape input-output" d="M 320 800 L 480 800 L 460 850 L 300 850 Z" />
            <text class="text" x="390" y="830">Tampilkan Hasil</text>
            
            <!-- Arrow 10 -->
            <path class="arrow" d="M 390 850 L 390 890" />
            
            <!-- Process: Log Activity -->
            <rect class="shape process" x="310" y="890" width="160" height="60" rx="5" />
            <text class="text" x="390" y="915">Log Activity</text>
            <text class="text" x="390" y="932">& Notifikasi</text>
            
            <!-- Arrow 11 -->
            <path class="arrow" d="M 390 950 L 390 990" />
            
            <!-- Decision: Lanjut? -->
            <path class="shape decision" d="M 390 990 L 490 1040 L 390 1090 L 290 1040 Z" />
            <text class="text" x="390" y="1035">Lanjut</text>
            <text class="text" x="390" y="1052">Proses?</text>
            
            <!-- Arrow 12: Yes -->
            <path class="arrow" d="M 290 1040 L 150 1040 L 150 155 L 300 155" />
            <text class="arrow-label" x="170" y="1035">Ya</text>
            
            <!-- Arrow 13: No -->
            <path class="arrow" d="M 390 1090 L 390 1130" />
            <text class="arrow-label" x="410" y="1115">Tidak</text>
            
            <!-- End -->
            <ellipse class="shape start-end" cx="400" cy="1160" rx="80" ry="40" />
            <text class="text" x="400" y="1167">SELESAI</text>
        </svg>
        
        <div class="legend">
            <h3>Keterangan Simbol:</h3>
            <div class="legend-item">
                <div class="legend-shape" style="background: #4CAF50; border-radius: 50%;"></div>
                <span class="legend-text"><strong>Terminator (Oval):</strong> Mulai / Selesai</span>
            </div>
            <div class="legend-item">
                <div class="legend-shape" style="background: #2196F3;"></div>
                <span class="legend-text"><strong>Process (Persegi):</strong> Proses / Operasi</span>
            </div>
            <div class="legend-item">
                <div class="legend-shape" style="background: #FF9800; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);"></div>
                <span class="legend-text"><strong>Decision (Belah Ketupat):</strong> Keputusan / Kondisi</span>
            </div>
            <div class="legend-item">
                <div class="legend-shape" style="background: #9C27B0; clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);"></div>
                <span class="legend-text"><strong>Input/Output (Jajar Genjang):</strong> Input / Output Data</span>
            </div>
        </div>
    </div>
</body>
</html>
